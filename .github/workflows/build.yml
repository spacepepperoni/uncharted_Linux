# Builds the Linux / Steam Deck package. Every build of main is published as a
# release (v<upstream version>-linux.<run>), which the launcher's update check looks for.
name: Build Linux package

on:
  # A push or pull request that only touches these (README edits, notes, the sync workflow)
  # changes nothing in the package, so it is not built or released.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/sync-upstream.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:
  # sync-upstream.yml builds a merge of upstream before it reaches main (no release then).
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  # A release build on main runs to the end (a newer push waits behind it); others are replaced.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || inputs.ref != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Debian 13: glibc 2.41, no newer than SteamOS 3.7+, and an SDL3 package.
    container: debian:trixie
    steps:
      - name: Dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            git ca-certificates curl build-essential cmake ninja-build pkgconf file binutils \
            python3 python3-venv python3-dev python3-tk \
            libsdl3-dev libvulkan-dev libfmt-dev libboost-dev robin-map-dev \
            libvulkan-memory-allocator-dev libxxhash-dev libx11-dev libzydis-dev libzycore-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libprotobuf-dev protobuf-compiler nlohmann-json3-dev libssl-dev zlib1g-dev \
            libminiupnpc-dev glslang-tools glslang-dev spirv-headers
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: recursive
          fetch-depth: 0
      - name: Build
        run: |
          git config --global --add safe.directory '*'
          BB_JOBS=3 bash build.sh
      - name: NVIDIA DLSS
        # Linux fork: package.sh bundles DLSS (DLAA, Frame Generation) only when this has put the
        # bridge and NVIDIA's DLSS libraries in out/dlss; without it the game fell back to FSR 3.1.
        run: bash packaging/linux/build_dlss.sh
      - name: Package
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" launcher/uncharted_launcher.py | head -1)
          echo "TAG=v$version-linux.${{ github.run_number }}" >> "$GITHUB_ENV"
          LINUX_BUILD="$version-linux.${{ github.run_number }}" bash packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uncharted-linux
          path: |
            dist/Uncharted-x86_64.AppImage
            dist/uncharted-linux.tar.gz
      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -yq --no-install-recommends gh >/dev/null
          gh release create "$TAG" dist/Uncharted-x86_64.AppImage dist/uncharted-linux.tar.gz --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Uncharted for Linux/Steam Deck $TAG" \
            --notes "Built from $(git log -1 --format='%h %s'). Install steps: see the README."
